<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credential Test Page</title>
    <style>
        body {
            font-family: -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: #f5f5f5;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
            width: 360px;
        }
        h2 { margin-top: 0; text-align: center; }
        label { display: block; margin-bottom: 4px; font-weight: 500; }
        input[type="text"], input[type="email"], input[type="password"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #007AFF;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover { background: #0062cc; }
        hr { margin: 30px 0; border: 0; border-top: 1px solid #eee; }
        .subtitle { color: #888; font-size: 12px; text-align: center; margin: 4px 0 16px; }
    </style>
</head>
<body>
<div class="card">

    <!-- Form 1: Traditional form with id/name attributes -->
    <form method="post" action="/login" id="login-form">
        <h2>Traditional Login</h2>
        <p class="subtitle">Form with id="login-form" — this WILL trigger detection</p>
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="user@example.com">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter password">
        <button type="submit" id="submit-btn">Sign In</button>
    </form>

    <hr>

    <!-- Form 2: Simpler form without IDs -->
    <form action="/auth">
        <h2>Simple Login</h2>
        <p class="subtitle">No id attributes — relies on heuristics</p>
        <label>Username</label>
        <input type="text" placeholder="username">
        <label>Password</label>
        <input type="password" placeholder="password">
        <button>Log In</button>
    </form>

    <hr>

    <!-- Form 3: SPA-style (no form element at all) -->
    <div id="spa-login">
        <h2>SPA-style Login</h2>
        <p class="subtitle">No &lt;form&gt; — relies on button click / Enter key detection</p>
        <label>Email</label>
        <input type="email" id="spa-email" name="spa-email" placeholder="user@example.com">
        <label>Password</label>
        <input type="password" id="spa-password" name="spa-password" placeholder="password">
        <button onclick="handleSPALogin()">Login</button>
    </div>

</div>

<script>
    // Prevent actual form submissions so we don't get 404s
    document.querySelectorAll('form').forEach(f => {
        f.addEventListener('submit', e => e.preventDefault());
    });

    function handleSPALogin() {
        // SPA-style handler that doesn't use form submit at all
        var email = document.getElementById('spa-email').value;
        var pw = document.getElementById('spa-password').value;
        alert('SPA login: ' + (email || 'empty') + ' / ' + (pw ? '***' : 'empty'));
    }
</script>
</body>
</html>
