name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-release:
    runs-on: macos-26
    permissions:
      contents: write
    env:
      LSW_BUILD_ROOT: ${{ github.workspace }}/.build/distribution
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version and publishing configuration
        id: version
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          TAP_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          VERSION="$(cat VERSION)"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "v$VERSION"
            test -n "$SPARKLE_PRIVATE_KEY" || { echo 'Missing SPARKLE_PRIVATE_KEY'; exit 1; }
            test -n "$TAP_KEY" || { echo 'Missing HOMEBREW_TAP_DEPLOY_KEY'; exit 1; }
            git merge-base --is-ancestor HEAD origin/main
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dmg=dist/LocalServerWrapper-v${VERSION}.dmg" >> "$GITHUB_OUTPUT"

      - name: Run regression tests
        run: ./scripts/test.sh

      - name: Build, verify, and package DMG
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DMG: ${{ steps.version.outputs.dmg }}
        run: ./make-dmg.sh "$VERSION" "$GITHUB_RUN_NUMBER" "$DMG"

      - name: Upload build for inspection
        uses: actions/upload-artifact@v4
        with:
          name: LocalServerWrapper-dmg
          path: dist/*.dmg
          if-no-files-found: error

      - name: Reuse an already-published archive on retries
        if: startsWith(github.ref, 'refs/tags/v')
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          DMG: ${{ steps.version.outputs.dmg }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft' > dist/is-draft.txt 2>/dev/null && test "$(cat dist/is-draft.txt)" = false; then
            gh release download "$GITHUB_REF_NAME" --pattern "$(basename "$DMG")" --dir dist --clobber
            echo 'published=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare signed update metadata
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
          DMG: ${{ steps.version.outputs.dmg }}
        run: |
          ./scripts/verify-dmg.sh "$DMG" "$VERSION" "$GITHUB_RUN_NUMBER"
          # Start from the current feed, not a possibly older tagged copy.
          git show origin/main:appcast.xml > appcast.xml
          ./update-appcast.sh "$VERSION" "$GITHUB_RUN_NUMBER" "$DMG" \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$(basename "$DMG")"
          python3 scripts/update-cask.py "$VERSION" "$DMG" dist/local-server-wrapper.rb

      - name: Publish the download before advertising it
        if: startsWith(github.ref, 'refs/tags/v') && steps.existing.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DMG: ${{ steps.version.outputs.dmg }}
        run: |
          git for-each-ref --format='%(contents)' "refs/tags/$GITHUB_REF_NAME" > dist/release-notes.md
          if gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft' > dist/is-draft.txt 2>/dev/null; then
            test "$(cat dist/is-draft.txt)" = true || { echo 'Release is already published; do not replace its signed archive'; exit 1; }
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "$GITHUB_REF_NAME" --notes-file dist/release-notes.md
          fi
          gh release upload "$GITHUB_REF_NAME" "$DMG" --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false

      - name: Publish appcast
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cp appcast.xml dist/appcast.xml
          git fetch origin main
          git restore appcast.xml
          git checkout -B codex/release-feed origin/main
          cp dist/appcast.xml appcast.xml
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add appcast.xml
          if ! git diff --cached --quiet; then
            git commit -m "Update appcast for $GITHUB_REF_NAME"
            git push origin HEAD:main
          fi

      - name: Checkout shared Homebrew tap
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/checkout@v4
        with:
          repository: martinrusetski/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: homebrew-tap

      - name: Publish shared Homebrew cask
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cp dist/local-server-wrapper.rb homebrew-tap/Casks/local-server-wrapper.rb
          git -C homebrew-tap config user.name 'github-actions[bot]'
          git -C homebrew-tap config user.email 'github-actions[bot]@users.noreply.github.com'
          git -C homebrew-tap add Casks/local-server-wrapper.rb
          if ! git -C homebrew-tap diff --cached --quiet; then
            git -C homebrew-tap commit -m "Update Local Server Wrapper to $GITHUB_REF_NAME"
            git -C homebrew-tap pull --rebase origin main
            git -C homebrew-tap push origin HEAD:main
          fi
